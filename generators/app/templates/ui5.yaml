specVersion: "4.0"
metadata:
  name: <%= libId %>
type: library
framework:
  name: <%= framework %>
  version: <%= frameworkVersion %>
  libraries:
    - name: sap.ui.core<% Object.keys(availableThemes).forEach((theme) => { %>
    - name: themelib_<%= theme %><% }) %>
server:
  customMiddleware:
    - name: "@ui5/middleware-code-coverage"
      afterMiddleware: compression
      configuration:
        excludePatterns:
          - "/resources/sap/"
          - "/resources/sap-ui"
          - "/resources/jquery"
          - "/resources/ui5loader"
          - "/test-resources/"
    - name: ui5-middleware-livereload
      afterMiddleware: compression
